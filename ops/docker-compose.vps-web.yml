services:
  web:
    image: ${SILVA_WEB_IMAGE:?Set an immutable storefront image}
    container_name: silva-moveis-web
    restart: unless-stopped
    env_file:
      - /opt/silva-moveis/web/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - silva-commerce
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  silva-commerce:
    external: true
    name: silva-moveis_silva-commerce
