name: silva-commerce-test
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: silva_commerce_test
      POSTGRES_USER: silva_test
      POSTGRES_PASSWORD: local-isolated-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silva_test -d silva_commerce_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
