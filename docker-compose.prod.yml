services:
  postgres:
    image: postgres:15-alpine
    container_name: silva-medusa-postgres
    restart: unless-stopped
    env_file: [.env.production]
    volumes:
      - medusa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    logging: &default-logging
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
    networks: [silva-private]

  redis:
    image: redis:7-alpine
    container_name: silva-medusa-redis
    restart: unless-stopped
    env_file: [.env.production]
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: ["medusa_redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    networks: [silva-private]

  medusa:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    container_name: silva-medusa-backend
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_DB_MIGRATION_CONNECTION_TIMEOUT: ${MEDUSA_DB_MIGRATION_CONNECTION_TIMEOUT:-60000}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${MEDUSA_HOST_PORT:-9000}:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging
    networks: [silva-private]

  # Opcional para staging/local. Produção usa o storefront da Vercel.
  silva-moveis-web:
    profiles: [staging]
    build: {context: ., dockerfile: Dockerfile}
    container_name: silva-moveis-web-staging
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_REGION_ID: ${NEXT_PUBLIC_MEDUSA_REGION_ID}
    depends_on:
      medusa: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    mem_limit: 768m
    logging: *default-logging
    networks: [silva-private]

volumes:
  medusa_postgres_data: {name: silva_medusa_postgres_data}
  medusa_redis_data: {name: silva_medusa_redis_data}

networks:
  silva-private:
    name: silva_private
    driver: bridge
